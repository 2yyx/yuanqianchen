{% extends "base.html" %}

{% block content %}
<section class="hero">
    <div class="container">
        <h2>欢迎来到袁乾宸的博客</h2>
        <p class="lead">记录成长、分享技术与生活点滴。</p>
    </div>
</section>

<section class="posts container">
    {% for post in posts %}
    <article class="post">
        <h3 class="post-title"><a href="/post/{{ post.slug }}">{{ post.title }}</a></h3>
        <p class="post-meta">{{ post.date }} · {{ post.summary }}</p>
    </article>
    {% endfor %}
</section>

<aside class="container about" id="about">
    <h4>关于作者</h4>
    <p>姓名：袁乾宸。这个博客用于记录学习与生活的点滴，欢迎交流。</p>
</aside>

{% endblock %}
